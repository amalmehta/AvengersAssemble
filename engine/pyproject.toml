[project]
name = "suite"
version = "0.1.0"
description = "Suite of Agents: a company of autonomous agents routed by multi-armed bandits"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.70", "pyyaml>=6"]

[project.scripts]
suite = "suite.cli:main"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8", "httpx2>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
